services:
  - type: web
    name: glycoguard
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: glycoguard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/glycoguard.sqlite
      - key: ADMIN_TOKEN
        sync: false
