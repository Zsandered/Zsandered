services:
  - type: web
    name: glycoguard
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/glycoguard.sqlite
      - key: ADMIN_TOKEN
        sync: false
